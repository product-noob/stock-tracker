services:
  db:
    image: postgres:17.11@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    container_name: stocktracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocktracker
      POSTGRES_USER: stocktracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host port 5433 to avoid any clash with other Postgres instances
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktracker -d stocktracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
