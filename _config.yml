# GitHub Pages site for the US equity briefs archive.
title: US Markets Briefs
description: Daily pre-market, mid-session and close briefs — US equity portfolio & watchlist.
baseurl: "/stock-tracker"
theme: jekyll-theme-cayman

# Give every markdown page under us-markets/ a layout, so briefs and
# weekly letters render as HTML without needing front matter in each file.
defaults:
  - scope:
      path: "us-markets"
    values:
      layout: default

# Keep the raw JSON state file out of the sitemap noise but still published.
exclude:
  - "*.gemspec"
